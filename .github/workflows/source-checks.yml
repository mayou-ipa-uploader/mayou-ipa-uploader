name: Client source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:guard
      - run: npm run typecheck
      - run: npm test
      - run: go -C daemon test ./...
      - run: go -C daemon build -o ipauploader-daemon .
